<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HomeDirect · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0B211C; --ink2:#10312A; --panel:#0F2A24; --line:#1D4139;
    --primary:#12735C; --mint:#2FD3A3; --text:#E8F2EE; --muted:#8CA9A0;
    --danger:#F0776B; --warn:#E9B44C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);
       font-family:Inter,system-ui,sans-serif;font-size:14px}
  h1,h2,h3,.display{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#1D4139;border-radius:6px}

  .app{display:flex;min-height:100vh}
  .side{width:236px;flex:0 0 236px;background:var(--ink2);border-right:1px solid var(--line);
        padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:var(--mint);
    display:grid;place-items:center;color:var(--ink);font-weight:700}
  .navbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 12px;border-radius:11px;border:none;background:transparent;color:var(--muted);
    font-size:14px;font-weight:500;text-align:left;width:100%}
  .navbtn:hover{background:#14382F;color:var(--text)}
  .navbtn.on{background:var(--primary);color:#fff;font-weight:600}
  .badge{background:var(--mint);color:var(--ink);border-radius:20px;padding:1px 8px;
    font-size:11px;font-weight:700}
  .navbtn.on .badge{background:#fff;color:var(--primary)}

  .main{flex:1;min-width:0;padding:26px 30px 60px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
  .head h1{margin:0;font-size:26px}
  .head p{margin:6px 0 0;color:var(--muted)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
  .card .n{font-family:'Space Grotesk';font-size:30px;font-weight:700;line-height:1}
  .card .l{color:var(--muted);font-size:12.5px;margin-top:7px;text-transform:uppercase;letter-spacing:.08em}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th{ text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
      color:var(--muted);padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#12332B}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tab{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:transparent;
       color:var(--muted);font-size:13px;font-weight:500}
  .tab.on{background:var(--mint);border-color:var(--mint);color:var(--ink);font-weight:700}

  .btn{border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;
       background:var(--primary);color:#fff}
  .btn:hover{filter:brightness(1.12)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  .btn.mint{background:var(--mint);color:var(--ink)}
  .btn:disabled{opacity:.45;cursor:default}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
  .pill.active{background:rgba(47,211,163,.16);color:var(--mint)}
  .pill.pending{background:rgba(233,180,76,.16);color:var(--warn)}
  .pill.rejected,.pill.open{background:rgba(240,119,107,.16);color:var(--danger)}
  .pill.rented,.pill.draft,.pill.dismissed{background:#1D4139;color:var(--muted)}
  .pill.approved,.pill.resolved{background:rgba(47,211,163,.16);color:var(--mint)}

  .in{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:11px;
      padding:11px 13px;color:var(--text);font-size:14px}
  .in:focus{outline:none;border-color:var(--primary)}

  .thumb{width:52px;height:40px;border-radius:8px;object-fit:cover;background:#1D4139;flex:0 0 auto}
  .row{display:flex;align-items:center;gap:11px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}

  .overlay{position:fixed;inset:0;background:rgba(4,14,11,.72);display:grid;place-items:center;
           padding:24px;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(680px,100%);
         max-height:88vh;overflow:auto;padding:24px}

  .login{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(900px 500px at 20% -10%, #17493C 0%, var(--ink) 60%)}
  .loginbox{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);
    border-radius:22px;padding:32px}
  .err{background:rgba(240,119,107,.12);border:1px solid rgba(240,119,107,.4);
    color:var(--danger);border-radius:11px;padding:11px 13px;font-size:13px;margin-bottom:14px}
  .empty{padding:56px 20px;text-align:center;color:var(--muted)}
  @media (max-width:820px){
    .app{flex-direction:column}
    .side{width:100%;flex:none;height:auto;position:static;flex-direction:row;overflow-x:auto}
    .brand{display:none}
    .main{padding:20px 16px 50px}
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // If any script error happens, show it on the page instead of a blank screen.
  window.addEventListener('error', function (e) {
    var r = document.getElementById('root');
    if (r && !r.hasChildNodes()) {
      r.innerHTML = '<div style="font-family:system-ui;max-width:640px;margin:60px auto;padding:24px;'
        + 'border:1px solid #eee;border-radius:12px;color:#333">'
        + '<h3 style="margin:0 0 8px">Something stopped the page loading</h3>'
        + '<p style="color:#666">' + (e && e.message ? e.message : 'Unknown error') + '</p>'
        + '<p style="color:#999;font-size:13px">Check the browser console (F12) for details.</p></div>';
    }
  });
</script>

<script type="text/plain" id="babel-src">
// ===================== CONFIG SPOT — PASTE HERE ==========================
const SUPABASE_URL = 'https://kyeyreriaiydbnnyiobm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ktxYlImZtqLR4-FzlyZx3A_oTjX4h7v';
// =========================================================================

const { useState, useEffect, useCallback } = React;
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const money = (n, c='RWF') => c + ' ' + Number(n||0).toLocaleString('en-US');
const when  = s => s ? new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const Pill  = ({s}) => <span className={'pill '+s}>{s}</span>;

function notify(userId, title, body, linkId){
  return db.from('notifications').insert({user_id:userId, title, body, link_id:linkId||null});
}

// ------------------------------------------------------------------ LOGIN
function Login({onIn}){
  const [email,setEmail]=useState(''), [pass,setPass]=useState('');
  const [err,setErr]=useState(''), [busy,setBusy]=useState(false);

  async function submit(e){
    e.preventDefault(); setErr(''); setBusy(true);
    const { data, error } = await db.auth.signInWithPassword({email:email.trim(), password:pass});
    if(error){ setBusy(false); return setErr(error.message); }
    const { data:prof } = await db.from('profiles').select('*').eq('id', data.user.id).single();
    if(!prof || !prof.is_admin){
      await db.auth.signOut(); setBusy(false);
      return setErr('This account does not have admin access.');
    }
    onIn(prof);
  }

  return (
    <div className="login">
      <form className="loginbox" onSubmit={submit}>
        <div className="row" style={{marginBottom:22}}>
          <div className="mark" style={{width:34,height:34,borderRadius:10,background:'var(--mint)',
            display:'grid',placeItems:'center',color:'var(--ink)',fontWeight:700}}>H</div>
          <div>
            <div className="display" style={{fontSize:18,fontWeight:700}}>HomeDirect</div>
            <div className="muted small">Admin portal</div>
          </div>
        </div>
        <h2 style={{margin:'0 0 6px',fontSize:22}}>Sign in</h2>
        <p className="muted small" style={{margin:'0 0 20px'}}>Only accounts marked as admin can open this portal.</p>
        {err && <div className="err">{err}</div>}
        <input className="in" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} />
        <div style={{height:12}} />
        <input className="in" type="password" placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} />
        <div style={{height:18}} />
        <button className="btn mint" style={{width:'100%',padding:'13px'}} disabled={busy}>
          {busy ? 'Checking…' : 'Sign in'}
        </button>
      </form>
    </div>
  );
}

// -------------------------------------------------------------- OVERVIEW
function Overview({go}){
  const [s,setS]=useState(null);
  useEffect(()=>{ db.rpc('admin_stats').then(({data})=>setS(data||{})); },[]);
  if(!s) return <div className="empty">Loading…</div>;
  const cards = [
    ['Waiting for review', s.pending, 'listings'],
    ['Live listings', s.active, 'listings'],
    ['Rented out', s.rented, null],
    ['Owners', s.owners, 'users'],
    ['Tenants', s.tenants, 'users'],
    ['ID checks waiting', s.docs_pending, 'verification'],
    ['Open reports', s.reports_open, 'reports'],
    ['Requests this week', s.inquiries_week, null],
  ];
  return (
    <>
      <div className="head">
        <div><h1>Overview</h1><p>Where HomeDirect stands right now.</p></div>
      </div>
      <div className="cards">
        {cards.map(([l,n,t])=>(
          <div key={l} className="card" style={{cursor:t?'pointer':'default'}} onClick={()=>t&&go(t)}>
            <div className="n">{n ?? 0}</div>
            <div className="l">{l}</div>
          </div>
        ))}
      </div>
      <div className="panel" style={{padding:22}}>
        <h3 style={{margin:'0 0 8px'}}>What needs you first</h3>
        <p className="muted" style={{margin:0,lineHeight:1.6}}>
          Clear the review queue so owners are not left waiting, then check ID documents,
          then open reports. Anything you approve goes live to tenants immediately.
        </p>
      </div>
    </>
  );
}

// -------------------------------------------------------------- LISTINGS
function Listings(){
  const [tab,setTab]=useState('pending');
  const [rows,setRows]=useState(null);
  const [open,setOpen]=useState(null);

  const load = useCallback(async ()=>{
    setRows(null);
    let q = db.from('properties')
      .select('*, property_photos(url), owner:profiles!properties_owner_id_fkey(id,full_name,phone,is_verified)')
      .order('created_at',{ascending:false}).limit(200);
    if(tab!=='all') q = q.eq('status', tab);
    const { data, error } = await q;
    setRows(error ? [] : data);
  },[tab]);
  useEffect(()=>{ load(); },[load]);

  async function approve(p){
    await db.from('properties').update({status:'active', reject_reason:null}).eq('id',p.id);
    await notify(p.owner_id,'Listing approved','"'+p.title+'" is now live for tenants.',p.id);
    load();
  }
  async function reject(p){
    const reason = prompt('Why is this listing rejected? The owner will see this.');
    if(!reason) return;
    await db.from('properties').update({status:'rejected', reject_reason:reason}).eq('id',p.id);
    await notify(p.owner_id,'Listing needs changes','"'+p.title+'": '+reason,p.id);
    load();
  }
  async function feature(p){
    await db.from('properties').update({is_featured:!p.is_featured}).eq('id',p.id);
    load();
  }
  async function remove(p){
    if(!confirm('Delete "'+p.title+'" permanently?')) return;
    await db.from('properties').delete().eq('id',p.id);
    setOpen(null); load();
  }

  const tabs=['pending','active','rejected','rented','draft','all'];
  return (
    <>
      <div className="head">
        <div><h1>Listings</h1><p>Approve what is real, reject what is not.</p></div>
      </div>
      <div className="tabs">
        {tabs.map(t=><button key={t} className={'tab'+(tab===t?' on':'')} onClick={()=>setTab(t)}>{t}</button>)}
      </div>
      <div className="panel">
        {rows===null ? <div className="empty">Loading…</div>
        : rows.length===0 ? <div className="empty">Nothing {tab==='all'?'here':'in '+tab} right now.</div>
        : <table><thead><tr>
            <th>Property</th><th>Owner</th><th>Rent</th><th>Where</th><th>Status</th><th></th>
          </tr></thead><tbody>
          {rows.map(p=>(
            <tr key={p.id}>
              <td>
                <div className="row">
                  <img className="thumb" src={p.cover_url||(p.property_photos[0]||{}).url||''} alt="" />
                  <div>
                    <div style={{fontWeight:600}}>{p.title}</div>
                    <div className="muted small">{p.bedrooms} bed · {p.bathrooms} bath · {when(p.created_at)}</div>
                  </div>
                </div>
              </td>
              <td>
                <div>{(p.owner||{}).full_name||'—'}</div>
                <div className="muted small">{(p.owner||{}).is_verified ? 'Verified' : 'Not verified'}</div>
              </td>
              <td style={{whiteSpace:'nowrap'}}>{money(p.price,p.currency)}<div className="muted small">per {p.period}</div></td>
              <td className="small">{[p.sector,p.district].filter(Boolean).join(', ')||'—'}</td>
              <td><Pill s={p.status}/>{p.is_featured && <div className="muted small" style={{marginTop:4}}>Featured</div>}</td>
              <td style={{textAlign:'right',whiteSpace:'nowrap'}}>
                <button className="btn ghost" onClick={()=>setOpen(p)}>Open</button>
                {p.status==='pending' && <>
                  {' '}<button className="btn" onClick={()=>approve(p)}>Approve</button>
                  {' '}<button className="btn danger" onClick={()=>reject(p)}>Reject</button>
                </>}
              </td>
            </tr>
          ))}
        </tbody></table>}
      </div>

      {open && (
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setOpen(null)}>
          <div className="modal">
            <div className="head" style={{marginBottom:16}}>
              <div><h1 style={{fontSize:22}}>{open.title}</h1>
                   <p>{[open.address_line,open.sector,open.district,open.province].filter(Boolean).join(', ')}</p></div>
              <button className="btn ghost" onClick={()=>setOpen(null)}>Close</button>
            </div>
            <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:10}}>
              {[open.cover_url, ...open.property_photos.map(x=>x.url)].filter(Boolean).map((u,i)=>(
                <img key={i} src={u} alt="" style={{height:130,borderRadius:12,border:'1px solid var(--line)'}}/>
              ))}
            </div>
            <div className="cards" style={{margin:'16px 0'}}>
              <div className="card"><div className="n" style={{fontSize:20}}>{money(open.price,open.currency)}</div><div className="l">per {open.period}</div></div>
              <div className="card"><div className="n" style={{fontSize:20}}>{open.bedrooms}/{open.bathrooms}</div><div className="l">bed / bath</div></div>
              <div className="card"><div className="n" style={{fontSize:20}}>{open.views_count||0}</div><div className="l">views</div></div>
            </div>
            <p style={{lineHeight:1.65}}>{open.description||'No description.'}</p>
            {(open.amenities||[]).length>0 &&
              <p className="muted small">Amenities: {open.amenities.join(' · ')}</p>}
            <p className="muted small">
              Owner: {(open.owner||{}).full_name} · {(open.owner||{}).phone||'no phone'}
            </p>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:18}}>
              {open.status!=='active' && <button className="btn" onClick={()=>{approve(open);setOpen(null);}}>Approve and publish</button>}
              {open.status!=='rejected' && <button className="btn danger" onClick={()=>{reject(open);setOpen(null);}}>Reject</button>}
              <button className="btn ghost" onClick={()=>{feature(open);setOpen({...open,is_featured:!open.is_featured});}}>
                {open.is_featured?'Remove from featured':'Mark as featured'}
              </button>
              <button className="btn danger" onClick={()=>remove(open)}>Delete</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ----------------------------------------------------------------- USERS
function Users({me}){
  const [rows,setRows]=useState(null), [q,setQ]=useState(''), [role,setRole]=useState('all');

  const load=useCallback(async()=>{
    setRows(null);
    let sel = db.from('profiles').select('*').order('created_at',{ascending:false}).limit(300);
    if(role!=='all') sel = sel.eq('role',role);
    const { data } = await sel;
    setRows(data||[]);
  },[role]);
  useEffect(()=>{ load(); },[load]);

  async function set(u, patch){
    await db.from('profiles').update(patch).eq('id',u.id);
    load();
  }

  const shown = (rows||[]).filter(u=>{
    const s=(u.full_name+' '+(u.phone||'')).toLowerCase();
    return s.includes(q.toLowerCase());
  });

  return (
    <>
      <div className="head">
        <div><h1>People</h1><p>Owners and tenants using HomeDirect.</p></div>
      </div>
      <div className="tabs">
        {['all','owner','tenant'].map(r=>
          <button key={r} className={'tab'+(role===r?' on':'')} onClick={()=>setRole(r)}>{r}</button>)}
        <input className="in" style={{maxWidth:240,marginLeft:'auto'}} placeholder="Search name or phone"
               value={q} onChange={e=>setQ(e.target.value)} />
      </div>
      <div className="panel">
        {rows===null ? <div className="empty">Loading…</div>
        : shown.length===0 ? <div className="empty">No one matches that.</div>
        : <table><thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Joined</th><th></th></tr></thead><tbody>
          {shown.map(u=>(
            <tr key={u.id}>
              <td>
                <div style={{fontWeight:600}}>{u.full_name||'—'}
                  {u.is_admin && <span className="pill approved" style={{marginLeft:8}}>admin</span>}
                  {u.is_blocked && <span className="pill rejected" style={{marginLeft:8}}>suspended</span>}
                </div>
                <div className="muted small">{u.is_verified?'ID verified':'not verified'}</div>
              </td>
              <td className="small">{u.role}</td>
              <td className="small">{u.phone||'—'}</td>
              <td className="small">{when(u.created_at)}</td>
              <td style={{textAlign:'right',whiteSpace:'nowrap'}}>
                {u.role==='owner' &&
                  <button className="btn ghost" onClick={()=>set(u,{is_verified:!u.is_verified})}>
                    {u.is_verified?'Remove badge':'Mark verified'}</button>}
                {' '}
                {u.id!==me.id &&
                  <button className={'btn '+(u.is_blocked?'':'danger')} onClick={()=>set(u,{is_blocked:!u.is_blocked})}>
                    {u.is_blocked?'Restore':'Suspend'}</button>}
                {' '}
                {u.id!==me.id &&
                  <button className="btn ghost" onClick={()=>{
                    if(confirm((u.is_admin?'Remove':'Give')+' admin access for '+u.full_name+'?'))
                      set(u,{is_admin:!u.is_admin});
                  }}>{u.is_admin?'Remove admin':'Make admin'}</button>}
              </td>
            </tr>
          ))}
        </tbody></table>}
      </div>
    </>
  );
}

// ---------------------------------------------------------- VERIFICATION
function Verification(){
  const [rows,setRows]=useState(null), [tab,setTab]=useState('pending');

  const load=useCallback(async()=>{
    setRows(null);
    let q = db.from('verification_docs')
      .select('*, owner:profiles!verification_docs_owner_id_fkey(id,full_name,phone,is_verified)')
      .order('created_at',{ascending:false}).limit(200);
    if(tab!=='all') q=q.eq('status',tab);
    const { data } = await q;
    setRows(data||[]);
  },[tab]);
  useEffect(()=>{ load(); },[load]);

  async function view(d){
    const { data, error } = await db.storage.from('verification-docs').createSignedUrl(d.url, 300);
    if(error) return alert('Could not open the document: '+error.message);
    window.open(data.signedUrl,'_blank');
  }
  async function decide(d, ok){
    let note=null;
    if(!ok){ note = prompt('Why is it rejected? The owner sees this.'); if(!note) return; }
    await db.from('verification_docs').update({status: ok?'approved':'rejected', admin_note:note}).eq('id',d.id);
    if(ok) await db.from('profiles').update({is_verified:true}).eq('id',d.owner_id);
    await notify(d.owner_id, ok?'You are verified':'Document rejected',
      ok?'Your listings now carry the verified badge.':note);
    load();
  }

  return (
    <>
      <div className="head">
        <div><h1>ID checks</h1><p>Approve an owner only if the document clearly matches their name.</p></div>
      </div>
      <div className="tabs">
        {['pending','approved','rejected','all'].map(t=>
          <button key={t} className={'tab'+(tab===t?' on':'')} onClick={()=>setTab(t)}>{t}</button>)}
      </div>
      <div className="panel">
        {rows===null ? <div className="empty">Loading…</div>
        : rows.length===0 ? <div className="empty">Nothing here.</div>
        : <table><thead><tr><th>Owner</th><th>Document</th><th>Sent</th><th>Status</th><th></th></tr></thead><tbody>
          {rows.map(d=>(
            <tr key={d.id}>
              <td><div style={{fontWeight:600}}>{(d.owner||{}).full_name||'—'}</div>
                  <div className="muted small">{(d.owner||{}).phone||'no phone'}</div></td>
              <td className="small">{d.doc_type.replace(/_/g,' ')}</td>
              <td className="small">{when(d.created_at)}</td>
              <td><Pill s={d.status}/></td>
              <td style={{textAlign:'right',whiteSpace:'nowrap'}}>
                <button className="btn ghost" onClick={()=>view(d)}>View document</button>
                {d.status==='pending' && <>
                  {' '}<button className="btn" onClick={()=>decide(d,true)}>Approve</button>
                  {' '}<button className="btn danger" onClick={()=>decide(d,false)}>Reject</button>
                </>}
              </td>
            </tr>
          ))}
        </tbody></table>}
      </div>
    </>
  );
}

// --------------------------------------------------------------- REPORTS
function Reports(){
  const [rows,setRows]=useState(null), [tab,setTab]=useState('open');

  const load=useCallback(async()=>{
    setRows(null);
    let q = db.from('reports')
      .select('*, property:properties(id,title,status), reporter:profiles!reports_reporter_id_fkey(full_name)')
      .order('created_at',{ascending:false}).limit(200);
    if(tab!=='all') q=q.eq('status',tab);
    const { data } = await q;
    setRows(data||[]);
  },[tab]);
  useEffect(()=>{ load(); },[load]);

  async function close(r, status){
    const note = prompt('Note for the record (optional)') || null;
    await db.from('reports').update({status, admin_note:note}).eq('id',r.id);
    load();
  }
  async function pull(r){
    if(!r.property_id) return;
    const reason = prompt('Reason to take this listing down (the owner sees it)');
    if(!reason) return;
    await db.from('properties').update({status:'rejected', reject_reason:reason}).eq('id',r.property_id);
    await db.from('reports').update({status:'resolved', admin_note:'Listing taken down'}).eq('id',r.id);
    load();
  }

  return (
    <>
      <div className="head">
        <div><h1>Reports</h1><p>What tenants have flagged.</p></div>
      </div>
      <div className="tabs">
        {['open','resolved','dismissed','all'].map(t=>
          <button key={t} className={'tab'+(tab===t?' on':'')} onClick={()=>setTab(t)}>{t}</button>)}
      </div>
      <div className="panel">
        {rows===null ? <div className="empty">Loading…</div>
        : rows.length===0 ? <div className="empty">Nothing here.</div>
        : <table><thead><tr><th>Listing</th><th>Reason</th><th>From</th><th>Status</th><th></th></tr></thead><tbody>
          {rows.map(r=>(
            <tr key={r.id}>
              <td><div style={{fontWeight:600}}>{(r.property||{}).title||'deleted listing'}</div>
                  <div className="muted small">{when(r.created_at)}</div></td>
              <td className="small"><div>{r.reason}</div>
                  {r.details && <div className="muted">{r.details}</div>}</td>
              <td className="small">{(r.reporter||{}).full_name||'—'}</td>
              <td><Pill s={r.status}/></td>
              <td style={{textAlign:'right',whiteSpace:'nowrap'}}>
                {r.status==='open' && <>
                  <button className="btn danger" onClick={()=>pull(r)}>Take listing down</button>
                  {' '}<button className="btn" onClick={()=>close(r,'resolved')}>Resolve</button>
                  {' '}<button className="btn ghost" onClick={()=>close(r,'dismissed')}>Dismiss</button>
                </>}
              </td>
            </tr>
          ))}
        </tbody></table>}
      </div>
    </>
  );
}

// ------------------------------------------------------------- BROADCAST
function Broadcast(){
  const [audience,setAudience]=useState('all');
  const [title,setTitle]=useState(''), [body,setBody]=useState('');
  const [busy,setBusy]=useState(false), [done,setDone]=useState('');

  async function send(){
    if(!title.trim()) return;
    setBusy(true); setDone('');
    let q = db.from('profiles').select('id');
    if(audience!=='all') q=q.eq('role',audience);
    const { data:people } = await q;
    const rows=(people||[]).map(p=>({user_id:p.id,title:title.trim(),body:body.trim()}));
    for(let i=0;i<rows.length;i+=400){
      await db.from('notifications').insert(rows.slice(i,i+400));
    }
    setBusy(false); setTitle(''); setBody('');
    setDone('Sent to '+rows.length+' '+(rows.length===1?'person':'people')+'.');
  }

  return (
    <>
      <div className="head">
        <div><h1>Announcement</h1><p>Drops into the notifications tab inside the app.</p></div>
      </div>
      <div className="panel" style={{padding:22,maxWidth:620}}>
        <div className="tabs">
          {[['all','Everyone'],['owner','Owners only'],['tenant','Tenants only']].map(([v,l])=>
            <button key={v} className={'tab'+(audience===v?' on':'')} onClick={()=>setAudience(v)}>{l}</button>)}
        </div>
        <input className="in" placeholder="Title" value={title} onChange={e=>setTitle(e.target.value)} />
        <div style={{height:12}} />
        <textarea className="in" rows="4" placeholder="Message" value={body} onChange={e=>setBody(e.target.value)} />
        <div style={{height:16}} />
        <button className="btn mint" onClick={send} disabled={busy||!title.trim()}>
          {busy?'Sending…':'Send announcement'}
        </button>
        {done && <p className="muted small" style={{marginBottom:0}}>{done}</p>}
        {/* SPOT: SMS blast. Once an SMS provider is connected, add a checkbox here
            that also pushes this text to phone numbers. */}
      </div>
    </>
  );
}

// ------------------------------------------------------------------ APP
function App(){
  const [me,setMe]=useState(null), [boot,setBoot]=useState(true), [page,setPage]=useState('overview');
  const [counts,setCounts]=useState({});

  useEffect(()=>{ (async()=>{
    const { data:{ session } } = await db.auth.getSession();
    if(session){
      const { data:prof } = await db.from('profiles').select('*').eq('id',session.user.id).single();
      if(prof && prof.is_admin) setMe(prof); else await db.auth.signOut();
    }
    setBoot(false);
  })(); },[]);

  useEffect(()=>{ if(me) db.rpc('admin_stats').then(({data})=>setCounts(data||{})); },[me,page]);

  if(boot) return <div className="login"><div className="muted">Loading…</div></div>;
  if(!me) return <Login onIn={setMe} />;

  const nav=[
    ['overview','Overview',null],
    ['listings','Listings',counts.pending],
    ['users','People',null],
    ['verification','ID checks',counts.docs_pending],
    ['reports','Reports',counts.reports_open],
    ['broadcast','Announcement',null],
  ];

  return (
    <div className="app">
      <aside className="side">
        <div className="brand">
          <div className="mark">H</div>
          <div>
            <div className="display" style={{fontWeight:700}}>HomeDirect</div>
            <div className="muted" style={{fontSize:11}}>Admin</div>
          </div>
        </div>
        {nav.map(([k,l,n])=>(
          <button key={k} className={'navbtn'+(page===k?' on':'')} onClick={()=>setPage(k)}>
            <span>{l}</span>{n>0 && <span className="badge">{n}</span>}
          </button>
        ))}
        <div style={{flex:1}} />
        <div className="muted small" style={{padding:'0 12px 8px'}}>{me.full_name}</div>
        <button className="navbtn" onClick={async()=>{ await db.auth.signOut(); setMe(null); }}>Sign out</button>
      </aside>
      <main className="main">
        {page==='overview' && <Overview go={setPage} />}
        {page==='listings' && <Listings />}
        {page==='users' && <Users me={me} />}
        {page==='verification' && <Verification />}
        {page==='reports' && <Reports />}
        {page==='broadcast' && <Broadcast />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
(function () {
  try {
    var code = document.getElementById('babel-src').textContent;
    var out = Babel.transform(code, {
      presets: [['react', { runtime: 'classic' }]],
      sourceType: 'script'
    }).code;
    var s = document.createElement('script');
    s.textContent = out;
    document.body.appendChild(s);
  } catch (err) {
    var r = document.getElementById('root');
    if (r) r.innerHTML =
      '<div style="font-family:system-ui;max-width:680px;margin:60px auto;padding:24px;'
      + 'border:1px solid #eee;border-radius:12px;color:#333">'
      + '<h3 style="margin:0 0 8px">Build error</h3>'
      + '<pre style="white-space:pre-wrap;color:#b00;font-size:13px">'
      + ((err && err.message) ? err.message : String(err)) + '</pre></div>';
  }
})();
</script>
</body>
